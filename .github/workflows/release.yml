name: release

# 推送 v* tag 触发：CI 构建 → pack（含 SourceLink 符号）→ GitHub Release 发布
# 若仓库配置了 NUGET_API_KEY secret，则同时自动上架 NuGet.org
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      NUGET_KEY: ${{ secrets.NUGET_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (CI mode, embeds sources for SourceLink)
        run: dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack --no-build -c Release -o dist -p:ContinuousIntegrationBuild=true

      - name: Push to NuGet.org (only when NUGET_API_KEY is configured)
        if: env.NUGET_KEY != ''
        run: >
          dotnet nuget push "dist/*.nupkg"
          --api-key ${{ env.NUGET_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create "$tag" dist/*.nupkg dist/*.snupkg `
            --title "$tag" `
            --generate-notes
